    azure: { DEFAULT: '#4361FF', light: '#93A5FF', deep: '#2A3BC0' }, iris: { DEFAULT: '#8B5CF6', light: '#C4B5FD', deep: '#5B33D6' },

} } };
</script>
<style>
/* Layout: a device stage beside a quiet test panel (stacks under 820px). The phone keeps the app's own night look in both themes; only the page around it follows the viewer's theme. */
:root {
  --page: #E9EAF7; --panel: #FFFFFF; --fg: #161838; --muted: #4D5182; --line: #CDD0EA; --chip: #E3E5F6;
  --accent: #3446E0; --accent-fg: #FFFFFF; --danger: #B4232F; --bezel: #0B0C1F;
  --display: 'Fredoka', ui-rounded, system-ui, sans-serif; --body: 'Figtree', system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #08091C; --panel: #13153A; --fg: #ECEBFF; --muted: #A3A6D6; --line: #282C66; --chip: #1C1F4E;
  --accent: #93A5FF; --accent-fg: #0B0D2A; --danger: #FF9C92; --bezel: #000000; color-scheme: dark } }
:root[data-theme="dark"] {
  --page: #08091C; --panel: #13153A; --fg: #ECEBFF; --muted: #A3A6D6; --line: #282C66; --chip: #1C1F4E;
  --accent: #93A5FF; --accent-fg: #0B0D2A; --danger: #FF9C92; --bezel: #000000; color-scheme: dark }
body { background: var(--page); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page { max-width: 1120px; margin: 0 auto; padding-block: 28px 56px; }
.page-head { display: flex; flex-direction: column; gap: 6px; margin-bottom: 24px; max-width: 64ch; }
.page-head h1 { font-family: var(--display); font-weight: 600; font-size: 32px; line-height: 1.1; margin: 0; text-wrap: balance; }
.page-head p { margin: 0; color: var(--muted); font-size: 16px; }
.layout { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 36px; align-items: start; }
.stagecol { position: sticky; top: max(16px, env(safe-area-inset-top, 0px)); }
@media (max-width: 819px) { .layout { grid-template-columns: minmax(0, 1fr); } .stagecol { position: static; justify-self: center; } }
.stage { position: relative; width: calc(417px * var(--s, .8)); height: calc(876px * var(--s, .8)); }
.device { position: absolute; left: 0; top: 0; width: 417px; height: 876px; padding: 12px; border-radius: 60px; background: var(--bezel);
  transform: scale(var(--s, .8)); transform-origin: 0 0; box-shadow: 0 0 0 1px var(--line), 0 30px 60px -30px rgba(0,0,0,.45); }
.host { position: relative; width: 393px; height: 852px; border-radius: 48px; overflow: hidden; -webkit-font-smoothing: antialiased; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 22px; min-width: 0; max-width: 560px; }
.pgroup { display: flex; flex-direction: column; gap: 10px; }
.pgroup h2 { font-family: var(--display); font-size: 19px; font-weight: 600; margin: 0; }
.steps { margin: 0; padding-left: 1.4em; list-style: decimal; display: flex; flex-direction: column; gap: 6px; }
.steps li::marker { font-weight: 800; color: var(--accent); }
.steps li.done { color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 0; }
.stats div { background: var(--chip); border-radius: 12px; padding: 9px 12px; min-width: 0; }
.stats dt { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 800; }
.stats dd { margin: 2px 0 0; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.prow { display: flex; flex-wrap: wrap; gap: 8px; }
.pbtn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--chip); color: var(--fg);
  border-radius: 999px; padding: 8px 14px; font: 700 14px/1.2 var(--body); cursor: pointer; }
.pbtn:hover { border-color: var(--muted); }
.pbtn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.pbtn.danger { color: var(--danger); }
.pbtn:disabled { opacity: .45; cursor: not-allowed; }
.toggle { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.toggle input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); flex-shrink: 0; }
.muted { color: var(--muted); }
.fine { font-size: 13px; color: var(--muted); margin: 0; }
.panel :focus-visible { outline: 3px solid #3446E0; outline-offset: 2px; }
.panel :focus-visible { outline-color: var(--accent); }

/* App parts: "Till Morning Night". The phone keeps this look in both page themes.
   The 11 PM scroll happens in the dark, so Till Morning lives there too: a deep indigo night, lit by one electric blue.
   Rules: one action colour (volt blue). Violet belongs to the Shopping Pass and to the big moments.
   Colour means something: mint protected, amber XP, coral impulse, violet Shopping Pass.
   Surfaces stay flat; colour arrives as light (halos, the breathing orb) or as tinted icon tiles.
   Stickers keep a white die-cut edge, like vinyl on a dark laptop lid. Every card and button keeps a pressable bottom edge. */
.host { background: #0D0F2E; color: #F3F2FF; font-family: 'Figtree', system-ui, -apple-system, sans-serif; }
:where(.host) :is(h1, h2) { font-family: 'Fredoka', ui-rounded, system-ui, sans-serif; font-weight: 600; }
.ic { width: 1em; height: 1em; display: inline-block; flex-shrink: 0; vertical-align: -.125em; }
.scroll { overflow-y: auto; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }

/* type */
.t-display { font: 600 36px/1.08 'Fredoka', ui-rounded, system-ui, sans-serif; letter-spacing: -.01em; text-wrap: balance; }
.t-h1 { font: 600 29px/1.13 'Fredoka', ui-rounded, system-ui, sans-serif; text-wrap: balance; }
.t-h2 { font: 600 20px/1.2 'Fredoka', ui-rounded, system-ui, sans-serif; }
.t-title { font-size: 16.5px; line-height: 1.3; font-weight: 700; }
.t-body { font-size: 16.5px; line-height: 1.45; font-weight: 500; color: #B4B6E4; text-wrap: pretty; }
.t-small { font-size: 14px; line-height: 1.4; font-weight: 600; color: #B4B6E4; }
.t-label { font-size: 13.5px; line-height: 1.3; font-weight: 800; color: #8A8EC6; }
.t-num { font-family: 'Fredoka', ui-rounded, system-ui, sans-serif; font-weight: 600; font-variant-numeric: tabular-nums; }
.on-dark { color: #FFFFFF; }
.on-dark :is(.t-body, .t-small) { color: rgba(255, 255, 255, .82); }
.link { font-weight: 700; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }

/* surfaces: flat indigo, a hairline border, and a bottom edge in the same colour so they still look pressable */
.card { background: #161942; border: 1.5px solid #282C68; border-radius: 22px; box-shadow: 0 3px 0 #282C68; }
.divider { height: 1.5px; background: #23275E; }
.tile { display: flex; align-items: center; justify-content: center; border-radius: 14px; flex-shrink: 0; }
.tile.bg-mint { background: rgba(94, 233, 181, .14); color: #6EF0BF; }
.tile.bg-sun { background: rgba(255, 201, 77, .15); color: #FFD46E; }
.tile.bg-peach { background: rgba(255, 143, 120, .15); color: #FFAA97; }
.tile.bg-lav { background: rgba(167, 139, 250, .19); color: #CBBBFF; }
.tile.bg-hush { background: #1F2358; color: #B4B6E4; }
.sticker { border: 3px solid #FFFFFF; box-shadow: 0 6px 16px rgba(2, 3, 18, .55); color: #14163A; }
.sticker-sm { border: 2px solid #0D0F2E; color: #14163A; }
/* die-cut white edge around the illustrations, so they sit on the night like stickers */
.cut { filter: drop-shadow(2.5px 0 0 #fff) drop-shadow(-2.5px 0 0 #fff) drop-shadow(0 2.5px 0 #fff) drop-shadow(0 -2.5px 0 #fff) drop-shadow(0 10px 16px rgba(2, 3, 18, .5)); }
.halo { position: relative; isolation: isolate; }
.halo::before { content: ''; position: absolute; inset: -20%; border-radius: 50%; z-index: -1; pointer-events: none;
  background: radial-gradient(closest-side, rgba(92, 112, 255, .5), rgba(139, 92, 246, .2) 58%, rgba(139, 92, 246, 0)); }
.logo { display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: #FFFFFF; border-radius: 27%; }
.dashed { border: 2px dashed #343A80; border-radius: 20px; color: #B4B6E4; background: transparent; }
.field { background: #12153A; border: 1.5px solid #2E3374; border-radius: 16px; color: #F3F2FF; box-shadow: inset 0 2px 0 rgba(2, 3, 18, .25); }
.field::placeholder { color: #6E72AA; font-weight: 500; }
.field:focus { outline: none; border-color: #5B76FF; box-shadow: 0 0 0 3px rgba(91, 118, 255, .32); }
.hl { display: inline-block; padding: 0 .2em; border-radius: .16em; color: #14163A; box-shadow: 0 .07em 0 rgba(2, 3, 18, .35); }
.warn { background: rgba(255, 143, 120, .12); border: 1.5px solid rgba(255, 143, 120, .32); color: #FFE4DC; }
.rankcard { background: linear-gradient(135deg, #5A48F2 0%, #3D5AFE 100%); border-radius: 24px; box-shadow: 0 3px 0 #2A2FB0; color: #FFFFFF; }
.rankcard .sticker { color: #5B3FE0; }
.rank-bg { background: radial-gradient(120% 55% at 50% 0%, #3B2B97 0%, #0D0F2E 72%); }
.top-glow { background: radial-gradient(120% 36% at 50% 0%, rgba(124, 92, 255, .3) 0%, rgba(124, 92, 255, 0) 72%), #0D0F2E; }
.night { background:
  radial-gradient(1.6px 1.6px at 16% 18%, rgba(255,255,255,.8) 50%, transparent 52%),
  radial-gradient(1.2px 1.2px at 78% 12%, rgba(255,255,255,.65) 50%, transparent 52%),
  radial-gradient(1.4px 1.4px at 62% 30%, rgba(255,255,255,.55) 50%, transparent 52%),
  radial-gradient(1.1px 1.1px at 28% 44%, rgba(255,255,255,.5) 50%, transparent 52%),
  radial-gradient(1.5px 1.5px at 88% 52%, rgba(255,255,255,.55) 50%, transparent 52%),
  radial-gradient(1.2px 1.2px at 8% 66%, rgba(255,255,255,.4) 50%, transparent 52%),
  linear-gradient(180deg, #2B1D72 0%, #0D0F2E 100%); }
/* the two full-colour screens: electric blue for the wake-up question, a violet aurora for the pause */
.volt-bg { background: radial-gradient(120% 60% at 50% 0%, #7088FF 0%, rgba(112, 136, 255, 0) 62%), linear-gradient(180deg, #3F5BFF 0%, #2730C9 100%); }
.pause-bg { background: radial-gradient(130% 60% at 50% 27%, rgba(132, 150, 255, .5) 0%, rgba(132, 150, 255, 0) 62%), linear-gradient(180deg, #4E35DC 0%, #2C24A3 50%, #15124F 100%); }
.chaos-hot { background: linear-gradient(135deg, #FF5F87 0%, #FF9B5E 100%); color: #FFFFFF; }
.chaos-calm { background: linear-gradient(135deg, #3F5BFF 0%, #22B3D6 100%); color: #FFFFFF; }
.pausa-icon { background: linear-gradient(135deg, #5B76FF 0%, #3241D6 100%); color: #FFFFFF; overflow: hidden; }
.pausa-icon > svg, .bicon > svg { width: 100%; height: 100%; display: block; }
.wallpaper { background: radial-gradient(90% 55% at 15% 8%, #4A33C9 0%, rgba(74, 51, 201, 0) 62%), radial-gradient(80% 50% at 92% 78%, #1F4FD8 0%, rgba(31, 79, 216, 0) 62%), linear-gradient(180deg, #14123F 0%, #070818 100%); }

/* buttons: volt blue is the only action colour; each has a pressable edge */
.btn { --edge: #2A3BC0; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; padding: 15px 20px;
  font: 600 19px/1.2 'Fredoka', ui-rounded, system-ui, sans-serif; box-shadow: 0 4px 0 var(--edge); transition: translate .1s, box-shadow .1s, opacity .2s; }
.btn:active:not(:disabled) { translate: 0 3px; box-shadow: 0 1px 0 var(--edge); }
.btn:disabled { opacity: .38; cursor: not-allowed; }
.btn-primary { background: linear-gradient(180deg, #5B76FF 0%, #4361FF 100%); color: #FFFFFF; }
.btn-secondary { --edge: #343A86; background: #1E2256; color: #F3F2FF; border: 1.5px solid #343A86; }
.btn-cream { --edge: rgba(6, 6, 40, .38); background: #FFFFFF; color: #2B2FB8; }
.btn-cream .chip-mint { background: #D3FAE8; color: #0A6B47; }
.btn-ghost { --edge: rgba(6, 6, 40, .3); background: rgba(255, 255, 255, .1); color: #FFFFFF; border: 1.5px solid rgba(255, 255, 255, .32); }
.btn-danger { --edge: #6B2A45; background: #2A1638; color: #FF9F94; border: 1.5px solid #6B2A45; }
.backbtn { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; background: rgba(255, 255, 255, .08); color: #F3F2FF; }
.on-dark .backbtn { background: rgba(255, 255, 255, .16); color: #FFFFFF; }

/* chips (status) and tags (choices) */
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 10px; font-size: 12.5px; font-weight: 800; line-height: 1.35; white-space: nowrap; }
.chip-mint { background: rgba(94, 233, 181, .15); color: #74F0C1; }
.chip-sun { background: rgba(255, 201, 77, .16); color: #FFD46E; }
.chip-peach { background: rgba(255, 143, 120, .16); color: #FFAB98; }
.chip-lilac { background: rgba(167, 139, 250, .2); color: #CDBDFF; }
.chip-paper { background: #1E2256; color: #B4B6E4; border: 1.5px solid #2E3374; }
.chip-dark { background: rgba(255, 255, 255, .16); color: #FFFFFF; }
.chip-glass { background: rgba(255, 255, 255, .12); color: #FFFFFF; border: 1.5px solid rgba(255, 255, 255, .26); }
.chip-white { background: #FFFFFF; color: #14163A; box-shadow: 0 4px 10px rgba(2, 3, 18, .3); }
.plan .chip-sun { background: #FFC94D; color: #14163A; }
.tag { border: 1.5px solid #2E3374; border-radius: 999px; padding: 5px 12px; font-size: 13.5px; font-weight: 700; background: #1A1E50; color: #E4E3FF; line-height: 1.3; box-shadow: 0 2px 0 #2E3374; }
.tag[aria-pressed="true"] { background: #4361FF; border-color: #4361FF; color: #FFFFFF; box-shadow: 0 2px 0 #2A3BC0; }
.tag.lg { font-size: 16px; padding: 9px 18px; }
.on-dark .tag { background: rgba(255, 255, 255, .1); border-color: rgba(255, 255, 255, .36); color: #FFFFFF; box-shadow: none; }
.on-dark .tag[aria-pressed="true"] { background: #FFFFFF; border-color: #FFFFFF; color: #2B2FB8; }

/* selectable cards: quiet until chosen, then outlined in light (blue, or violet for the Shopping Pass) */
.opt { --sel: #1C2468; --hi: #5B76FF; --hi-edge: #3A52E0; background: #161942; border: 1.5px solid #282C68; border-radius: 20px; box-shadow: 0 3px 0 #282C68; text-align: left; color: #F3F2FF; transition: translate .1s, box-shadow .1s; }
.opt:active { translate: 0 2px; box-shadow: 0 1px 0 #282C68; }
.opt:is([aria-pressed="true"], [aria-checked="true"]) { background: var(--sel); border-color: var(--hi); box-shadow: inset 0 0 0 1px var(--hi), 0 3px 0 var(--hi-edge); }
.opt.reason { --sel: #261D66; --hi: #A78BFA; --hi-edge: #6D4FD6; }
.opt.plan { --sel: #1C2468; }
.opt.time[aria-checked="true"] { background: #8B5CF6; color: #FFFFFF; border-color: #8B5CF6; box-shadow: 0 3px 0 #5B33D6; }
.check { width: 26px; height: 26px; border-radius: 9px; border: 2px solid #3A3F86; background: #12153A; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 15px; color: #FFFFFF; }
.check.round { border-radius: 50%; }
.opt:is([aria-pressed="true"], [aria-checked="true"]) .check { background: var(--hi); border-color: var(--hi); }
.opt:is([aria-checked="true"]) .check.round::after { content: ''; width: 9px; height: 9px; border-radius: 50%; background: #FFFFFF; }
.mins { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 12px 0; border-radius: 18px; background: #161942; border: 1.5px solid #282C68; box-shadow: 0 3px 0 #282C68; }
.mins.on { background: #8B5CF6; color: #FFFFFF; border-color: #8B5CF6; box-shadow: 0 3px 0 #5B33D6; }
.rung { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 16px; }
.rung.here { background: rgba(255, 201, 77, .12); }

/* iOS-style switch in Till Morning blue */
.sw { width: 51px; height: 31px; border-radius: 999px; background: #2B2F69; position: relative; flex-shrink: 0; transition: background-color .2s; }
.sw span { position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 4px rgba(2, 3, 18, .4); transition: transform .2s; }
.sw.on { background: #4361FF; }
.sw.on span { transform: translateX(20px); }

/* progress */
.ptrack { flex: 1; height: 8px; border-radius: 999px; background: rgba(255, 255, 255, .1); overflow: hidden; }
.ptrack .pfill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #4361FF, #8B5CF6); }
.ptrack.dark { background: rgba(255, 255, 255, .22); }
.ptrack.dark .pfill { background: #FFFFFF; }

/* this week strip */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.wk { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.wk-d { font-size: 12px; font-weight: 800; color: #8A8EC6; }
.wk-dot { width: 34px; height: 34px; border-radius: 50%; background: rgba(255, 255, 255, .06); display: flex; align-items: center; justify-content: center;
  font: 600 15px 'Fredoka', ui-rounded, system-ui, sans-serif; color: #FFFFFF; }
.wk.has .wk-dot { background: #4361FF; }
.wk.today .wk-d { color: #93A5FF; }
.wk.today .wk-dot { box-shadow: 0 0 0 2.5px #161942, 0 0 0 4.5px #93A5FF; }
.wk.future .wk-dot { background: transparent; border: 1.5px dashed #343A80; }

/* the Shopping Pass is a violet ticket; the check-in plan is a paper receipt */
.ticket { --notch: 50%; position: relative; background: linear-gradient(120deg, #7E3FF2 0%, #B455F0 100%); border-radius: 22px; overflow: hidden; box-shadow: 0 3px 0 #5427B8; color: #FFFFFF; }
.ticket::before, .ticket::after { content: ''; position: absolute; width: 26px; height: 26px; border-radius: 50%; background: #0D0F2E; top: var(--notch); transform: translateY(-50%); }
.ticket::before { left: -13px; }
.ticket::after { right: -13px; }
.ticket .perf { position: absolute; left: 22px; right: 22px; top: var(--notch); border-top: 2px dashed rgba(255, 255, 255, .36); }
.perf-v { align-self: stretch; border-left: 2px dashed rgba(255, 255, 255, .36); margin: -8px 2px; }
.receipt-wrap { filter: drop-shadow(0 8px 16px rgba(2, 3, 18, .45)); }
.receipt { background: #F2F0FF; color: #14163A; padding: 14px 18px 22px; border-radius: 16px 16px 0 0;
  -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 16px 100%;
  mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 16px 100%; }
.receipt .t-label { color: #5D6192; }

/* tab bar */
.tabbar { margin: 4px 20px 30px; height: 64px; padding: 6px; border-radius: 999px; background: rgba(27, 31, 85, .94); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border: 1px solid #2E3374; box-shadow: 0 12px 30px rgba(4, 5, 24, .55), inset 0 1px 0 rgba(255, 255, 255, .06); display: flex; gap: 4px; }
.tabbar button { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border-radius: 999px; font-size: 10.5px; font-weight: 800; color: #8E93CC; transition: flex-grow .3s var(--ease), background .25s, color .25s; }
.tabbar button[aria-current="page"] { flex-grow: 1.7; flex-direction: row; gap: 7px; font-size: 14.5px; }
.tabbar button[aria-current="page"] { color: #FFFFFF; background: linear-gradient(180deg, #5873FF, #4361FF); box-shadow: 0 4px 14px rgba(67, 97, 255, .45), inset 0 1px 0 rgba(255, 255, 255, .25); }
.tabico { font-size: 21px; display: flex; }
.tabbar button[aria-current="page"] .tabico { color: #FFFFFF; }

/* the pause: a violet aurora, a breathing glow inside a thin ring */
#ring { transition: stroke-dashoffset .25s linear; }
#breath { width: 204px; height: 204px; border-radius: 50%; scale: .6; transition: scale .6s var(--spring), opacity .4s;
  background: radial-gradient(circle, rgba(200, 216, 255, .72) 0%, rgba(150, 170, 255, .3) 52%, rgba(150, 170, 255, 0) 71%); }
#breath.on { animation: breathe var(--cyc) ease-in-out var(--n) both; animation-delay: var(--del); }
#breath.done { scale: .95; background: radial-gradient(circle, rgba(214, 226, 255, .46) 0%, rgba(190, 206, 255, .2) 58%, rgba(190, 206, 255, 0) 72%); }
#pcount, #punit { text-shadow: 0 1px 10px rgba(28, 18, 110, .6); }
.pchoice.link:disabled { opacity: .4; cursor: not-allowed; }

/* overlays */
#ovl { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
.sheet-wrap { position: absolute; inset: 0; background: rgba(4, 5, 22, .62); display: flex; align-items: center; justify-content: center; pointer-events: auto; }
.banner { position: absolute; top: 54px; left: 10px; right: 10px; display: flex; gap: 10px; align-items: flex-start; padding: 11px 13px; border-radius: 22px;
  background: rgba(40, 40, 52, .95); box-shadow: 0 10px 30px rgba(0, 0, 0, .5); color: #F5F5F7; pointer-events: auto; text-align: left; }
.bicon { width: 38px; height: 38px; border-radius: 9px; overflow: hidden; background: linear-gradient(135deg, #5B76FF 0%, #3241D6 100%); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
.toast { position: absolute; left: 50%; top: 60px; transform: translateX(-50%); width: max-content; max-width: 88%; background: #262A6A; color: #FFFFFF; padding: 9px 16px; border-radius: 18px;
  border: 1px solid #3A3F8C; box-shadow: 0 8px 20px rgba(2, 3, 18, .4);
  font-weight: 700; font-size: 14px; text-align: center; pointer-events: none; display: flex; align-items: center; justify-content: center; gap: 8px; transition: top .25s; }
#ov-banner:not(:empty) ~ #ov-toast .toast { top: 150px; }
.island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 34px; border-radius: 20px; background: #000; z-index: 30; pointer-events: none; }
.homebar { position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); width: 180px; height: 28px; display: flex; align-items: center; justify-content: center; z-index: 25; cursor: pointer; background: transparent; border: 0; }
.homebar span { width: 134px; height: 5px; border-radius: 3px; background: #F3F2FF; }
.homebar.light span { background: #FFFFFF; }
.homebar.dark span { background: #111111; }
.host :focus-visible { outline: 3px solid #93A5FF; outline-offset: 2px; }
.on-dark :focus-visible { outline-color: #FFFFFF; }

/* "Locked at the bank" seal (SVG). It levels up with days locked in: Locked, Week strong, Month proof, Vault. */
.seal { display: block; flex-shrink: 0; overflow: visible; }
.seal.big { filter: drop-shadow(0 14px 22px rgba(2, 3, 18, .55)); }
.seal .seal-shine { animation: seal-shine 3.6s ease-in-out 1.2s infinite; }
@keyframes seal-shine { 0%, 70% { opacity: 0; translate: -70px 0; } 80% { opacity: .55; } 100% { opacity: 0; translate: 70px 0; } }
.tierrow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.tierrow li { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.gstep { display: flex; gap: 14px; align-items: flex-start; width: 100%; text-align: left; padding: 14px 16px; }
.gnum { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font: 600 15px 'Fredoka', ui-rounded, system-ui, sans-serif; background: #1F2358; color: #B4B6E4; border: 1.5px solid #343A80; transition: background-color .2s; }
.gstep[aria-checked="true"] .gnum { background: #5EE9B5; border-color: #5EE9B5; color: #0B3B33; }
.gstep[aria-checked="true"] .gtitle { color: #B4B6E4; text-decoration: line-through; text-decoration-color: rgba(180, 182, 228, .5); }
/* prototype-only hints (dashed so they read as "not part of the real app") */
.proto-hint { position: absolute; left: 50%; bottom: 100px; translate: -50% 0; z-index: 5; display: flex; align-items: center; gap: 8px; white-space: nowrap;
  padding: 10px 16px; border-radius: 999px; background: #FFC94D; color: #14163A; font-weight: 800; font-size: 14px; box-shadow: 0 8px 22px rgba(2, 3, 18, .5), 0 0 0 2px rgba(255, 201, 77, .35);
  animation: hint-bob 1.2s ease-in-out .8s 3; }
@keyframes hint-bob { 50% { translate: -50% -4px; } }
.sb-hint { border: 1.5px dashed rgba(255, 255, 255, .45); }
.xpchip.loss { background: rgba(255, 143, 120, .22); color: #FFAB98; }
/* setup demo: a 5-second pause played once */
#demoRing { stroke-dasharray: 691.15; stroke-dashoffset: 691.15; animation: demo-ring 5s linear .4s both; }
@keyframes demo-ring { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 691.15; } }
.demo-n { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; animation: demo-n 1s linear forwards; }
@keyframes demo-n { 0%, 99.9% { opacity: 1; } 100% { opacity: 0; } }
.demo-after { animation: in-fade .5s ease-out 5.4s backwards; }
#demoBreath { animation: breathe 5s ease-in-out .4s 1 both; }
/* first screen: hold to pause */
.hpill { position: absolute; font-size: 12.5px; font-weight: 800; padding: 6px 11px; border-radius: 999px; white-space: nowrap; animation: jig .5s ease-in-out infinite alternate; transition: opacity .3s; box-shadow: 0 6px 14px rgba(2, 3, 18, .4); }
@keyframes jig { from { transform: translate(0, 0) rotate(-4deg); } to { transform: translate(2px, -3px) rotate(4deg); } }
#holdBtn { cursor: pointer; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; border-radius: 50%; }
#holdBtn.holding { scale: .96; transition: scale .2s; }
/* 1. Morning card: a paper stamp card, slightly tilted, like the ones in a coffee shop */
.pcard { position: relative; background: #F2F0FF; color: #14163A; border-radius: 20px; padding: 16px 16px 14px; rotate: -1.2deg; box-shadow: 0 10px 24px rgba(2, 3, 18, .45); }
.pcard::before { content: ''; position: absolute; top: -8px; right: 22px; width: 46px; height: 16px; border-radius: 3px; background: rgba(167, 139, 250, .6); rotate: 7deg; }
.pc-title { font: 600 21px/1.1 'Fredoka', ui-rounded, system-ui, sans-serif; }
.pc-sub { font-size: 12.5px; font-weight: 700; color: #5D6192; margin-top: 2px; }
.pc-no { font-size: 11.5px; font-weight: 800; color: #3A2FB0; background: #E2DFFB; border-radius: 999px; padding: 3px 9px; white-space: nowrap; flex-shrink: 0; }
.pc-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 9px; margin-top: 13px; }
.pstamp, .pslot { aspect-ratio: 1; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.pstamp { background: #4361FF; color: #FFFFFF; font-size: 21px; rotate: var(--r, 0deg); box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .3); }
.pslot { border: 2px dashed #B8BBDF; }
.pslot.today { border: 2.5px dashed #4361FF; color: #3446E0; font-size: 10.5px; font-weight: 800; }
.pslot.missed { border-color: #FF8F78; color: #D2462F; font-size: 16px; }
.pc-foot { font-size: 13px; font-weight: 800; color: #3A2FB0; margin-top: 12px; }
.pc-today { font-size: 12.5px; font-weight: 700; color: #0E6E66; margin-top: 2px; }
.pc-today.bad { color: #C2412A; }
/* 5. tear the ticket */
.tearwrap { position: relative; display: flex; height: 98px; filter: drop-shadow(0 8px 18px rgba(2, 3, 18, .5)); }
.tk-main { flex: 1; min-width: 0; background: linear-gradient(120deg, #7E3FF2 0%, #B455F0 100%); border-radius: 18px 0 0 18px; padding: 12px 16px; display: flex; flex-direction: column; justify-content: center; color: #FFFFFF; text-align: left; }
.tk-label { font-size: 11.5px; font-weight: 800; opacity: .85; }
.tk-min { font: 600 30px/1.05 'Fredoka', ui-rounded, system-ui, sans-serif; }
.tk-app { font-size: 12.5px; font-weight: 700; opacity: .85; }
.tk-stub { width: 104px; flex-shrink: 0; background: #9B4CF4; color: #FFFFFF; border-left: 2.5px dashed rgba(255, 255, 255, .7); border-radius: 0 18px 18px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  font: 600 15px/1.1 'Fredoka', ui-rounded, system-ui, sans-serif; touch-action: none; cursor: grab; transition: transform .45s var(--spring), opacity .4s; -webkit-user-select: none; user-select: none; }
.tk-stub.dragging { transition: none; cursor: grabbing; }
.tk-main { -webkit-mask: radial-gradient(circle at 100% 0, transparent 8px, #000 8.5px) top / 100% 51% no-repeat, radial-gradient(circle at 100% 100%, transparent 8px, #000 8.5px) bottom / 100% 51% no-repeat;
  mask: radial-gradient(circle at 100% 0, transparent 8px, #000 8.5px) top / 100% 51% no-repeat, radial-gradient(circle at 100% 100%, transparent 8px, #000 8.5px) bottom / 100% 51% no-repeat; }
.tk-stub { -webkit-mask: radial-gradient(circle at 0 0, transparent 8px, #000 8.5px) top / 100% 51% no-repeat, radial-gradient(circle at 0 100%, transparent 8px, #000 8.5px) bottom / 100% 51% no-repeat;
  mask: radial-gradient(circle at 0 0, transparent 8px, #000 8.5px) top / 100% 51% no-repeat, radial-gradient(circle at 0 100%, transparent 8px, #000 8.5px) bottom / 100% 51% no-repeat; }
.tk-stub.wait { background: #4B3F7A; color: #C9CBF0; cursor: not-allowed; }
.tk-stub.wait .tk-arrow { display: none; }
.tk-arrow { display: flex; font-size: 15px; animation: nudge-x 1.2s ease-in-out infinite; }
@keyframes nudge-x { 50% { translate: 5px 0; } }
.usedtk { position: relative; display: flex; width: 236px; height: 92px; filter: drop-shadow(0 8px 18px rgba(2, 3, 18, .5)); }
.usedtk .tk-main { border-radius: 16px; border-right: 2.5px dashed rgba(255, 255, 255, .6); }
.usedstamp { position: absolute; right: -4px; top: 22px; rotate: -14deg; font: 600 24px/1 'Fredoka', ui-rounded, system-ui, sans-serif; color: #D61F4B; border: 3px solid #D61F4B; border-radius: 10px; padding: 4px 12px; background: rgba(255, 240, 243, .94); }
/* 9. receipt paywall */
.rc { padding: 18px 18px 28px; font-size: 14px; }
.rc-shop { font: 600 26px/1 'Fredoka', ui-rounded, system-ui, sans-serif; text-align: center; }
.rc-meta { text-align: center; font-size: 12px; font-weight: 600; color: #5D6192; margin-top: 4px; }
.rc-apps { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.rc-app { position: relative; width: 34px; height: 34px; border-radius: 50%; background: #FFFFFF; border: 1.5px solid #D3D6EE; padding: 4px; display: inline-flex; flex-shrink: 0; }
.rc-shield { position: absolute; right: -6px; bottom: -6px; width: 18px; height: 18px; border-radius: 50%; background: #5EE9B5; color: #0B3B33; font-size: 10px; display: flex; align-items: center; justify-content: center; border: 2px solid #F2F0FF; }
.rc-rule { border-top: 1.5px dashed #B8BBDF; margin: 13px 0; }
.rc-line { display: flex; align-items: baseline; gap: 6px; font-weight: 600; margin: 5px 0; }
.rc-dots { flex: 1; border-bottom: 1.5px dotted #B8BBDF; translate: 0 -4px; }
.rc-plan { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1.5px solid #D3D6EE; background: #FFFFFF; color: #14163A; }
.rc-plan[aria-checked="true"] { border-color: #3446E0; box-shadow: inset 0 0 0 1px #3446E0; background: #EEF1FF; }
.rc-radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #B8BBDF; flex-shrink: 0; }
.rc-plan[aria-checked="true"] .rc-radio { border-color: #3446E0; background: #3446E0; box-shadow: inset 0 0 0 4px #EEF1FF; }
.rc-best { font-size: 10.5px; font-weight: 800; background: #FFC94D; color: #14163A; border-radius: 999px; padding: 1px 7px; margin-left: 6px; vertical-align: 2px; }
.rc-sub { font-size: 12px; color: #5D6192; font-weight: 600; }
.rc-price { font: 600 18px/1.1 'Fredoka', ui-rounded, system-ui, sans-serif; }
.rc-total { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font: 600 22px/1.2 'Fredoka', ui-rounded, system-ui, sans-serif; }
.rc-due { display: flex; justify-content: space-between; font-weight: 800; font-size: 15px; color: #0E6E66; margin-top: 4px; }
.rc-note { font-size: 12px; color: #5D6192; font-weight: 600; margin-top: 4px; }
.rc-barcode { height: 34px; margin-top: 14px; background: repeating-linear-gradient(90deg, #14163A 0 2px, transparent 2px 4px, #14163A 4px 7px, transparent 7px 9px, #14163A 9px 10px, transparent 10px 13px); }
.rc-thanks { text-align: center; font-size: 12px; font-weight: 700; color: #5D6192; margin-top: 8px; }
/* "Need to shop?" ticket on Home: the way into a Shopping Pass without waiting for the shield */
.passcta { display: flex; width: 100%; text-align: left; border-radius: 18px; filter: drop-shadow(0 6px 14px rgba(2, 3, 18, .45)); }
.passcta .pm { flex: 1; min-width: 0; padding: 12px 15px; color: #FFFFFF; background: linear-gradient(120deg, #7E3FF2 0%, #B455F0 100%); border-radius: 18px 0 0 18px;
  -webkit-mask: radial-gradient(circle at 100% 0, transparent 8px, #000 8.5px) top / 100% 51% no-repeat, radial-gradient(circle at 100% 100%, transparent 8px, #000 8.5px) bottom / 100% 51% no-repeat;
  mask: radial-gradient(circle at 100% 0, transparent 8px, #000 8.5px) top / 100% 51% no-repeat, radial-gradient(circle at 100% 100%, transparent 8px, #000 8.5px) bottom / 100% 51% no-repeat; }
.passcta .pt { display: block; font: 600 19px/1.15 'Fredoka', ui-rounded, system-ui, sans-serif; }
.passcta .pd { display: block; margin-top: 2px; font-size: 13.5px; font-weight: 600; line-height: 1.35; color: rgba(255, 255, 255, .88); }
.passcta .ps { width: 82px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #FFFFFF; background: #9B4CF4;
  border-left: 2.5px dashed rgba(255, 255, 255, .7); border-radius: 0 18px 18px 0; font: 600 15px/1 'Fredoka', ui-rounded, system-ui, sans-serif;
  -webkit-mask: radial-gradient(circle at 0 0, transparent 8px, #000 8.5px) top / 100% 51% no-repeat, radial-gradient(circle at 0 100%, transparent 8px, #000 8.5px) bottom / 100% 51% no-repeat;
  mask: radial-gradient(circle at 0 0, transparent 8px, #000 8.5px) top / 100% 51% no-repeat, radial-gradient(circle at 0 100%, transparent 8px, #000 8.5px) bottom / 100% 51% no-repeat; }
.passcta .ps .i { font-size: 22px; display: flex; }
.passcta:focus-visible { outline: 3px solid #93A5FF; outline-offset: 3px; }
.passcta:active { transform: scale(.98); }
/* bottom sheets sit on the bottom edge (the base .sheet-wrap rule centres dialogs) */
.sheet-wrap.items-end { align-items: flex-end; }
.ticket-bar { background: linear-gradient(120deg, #7E3FF2 0%, #B455F0 100%); box-shadow: 0 2px 0 #5427B8; }

/* ---------- Motion ----------
   On a screen change the old screen stays on stage (#ghost) for half a second so the two can cross over.
   Entrance effects (.rise, .pop-in, .stamp, highlight pops) play only when the screen changes (#scr.enter),
   never when the same screen re-draws after a tap; taps get their own small feedback (.tapped).
   The iOS shield itself never animates: iOS draws it. Everything here switches off under Reduce Motion. */
.host { --ease: cubic-bezier(.2, .8, .2, 1); --spring: cubic-bezier(.34, 1.56, .64, 1); --base: 0ms; --ox: 196px; --oy: 426px; }
#scr { position: absolute; inset: 0; z-index: 1; }
#ghost { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
#ghost.over { z-index: 2; }
:where(#scr, #ghost) > * { background-color: #0D0F2E; }
#ghost.over:is([data-t="fwd"], [data-t="back"], [data-t="tab"], [data-t="tabL"], [data-t="tabR"]) > * { background: transparent; }

/* screen in */
#scr[data-t="fwd"], #scr[data-t="back"] { --base: 140ms; }
#scr[data-t="fade"], #scr:is([data-t="tab"], [data-t="tabL"], [data-t="tabR"]) { --base: 50ms; }
#scr.enter[data-t="tabL"] > * > .scroll { animation: sw-in-r .3s var(--ease) both; }
#scr.enter[data-t="tabR"] > * > .scroll { animation: sw-in-l .3s var(--ease) both; }
#scr.enter:is([data-t="tabL"], [data-t="tabR"]) nav [aria-current="page"] > span { animation: pop-in .4s var(--spring) both; }
#ghost[data-t="tabL"] > * > .scroll { animation: sw-out-l .2s ease-in both; }
#ghost[data-t="tabR"] > * > .scroll { animation: sw-out-r .2s ease-in both; }
@keyframes sw-in-r { from { transform: translateX(36px); opacity: 0; } }
@keyframes sw-in-l { from { transform: translateX(-36px); opacity: 0; } }
@keyframes sw-out-l { to { transform: translateX(-56px); opacity: 0; } }
@keyframes sw-out-r { to { transform: translateX(56px); opacity: 0; } }
#scr .scroll.swiping { will-change: transform; }
#wr-rule summary { list-style: none; } #wr-rule summary::-webkit-details-marker { display: none; }
#scr img { -webkit-user-drag: none; user-select: none; }
#scr[data-t="zoom"] { --base: 170ms; }
#scr[data-t="up"], #scr[data-t="slide"] { --base: 220ms; }
#scr.enter[data-t="fwd"] > * > :not(header):not(nav):not(footer) { animation: in-right .34s var(--ease) 70ms both; }
#scr.enter[data-t="back"] > * > :not(header):not(nav):not(footer) { animation: in-left .34s var(--ease) 70ms both; }
#scr.enter:is([data-t="fwd"], [data-t="back"]) > * > footer { animation: in-fade .26s ease-out 80ms both; }
#scr.enter[data-t="slide"] > * { animation: slide-in .42s var(--ease) both; box-shadow: -10px 0 30px rgba(0,0,0,.5); }
#scr.enter[data-t="tab"] > * > .scroll { animation: in-fade .26s ease-out both; }
#scr.enter[data-t="fade"] > * { animation: in-fade .32s ease-out both; }
#scr.enter[data-t="zoom"] > * { animation: app-open .44s var(--ease) both; transform-origin: var(--ox) var(--oy); overflow: hidden; }
#scr.enter[data-t="home"] > * { animation: home-back .44s var(--ease) both; transform-origin: var(--ox) var(--oy); }
#scr.enter[data-t="up"] > * { animation: sheet-up .46s var(--ease) both; }
#scr.enter .pfill { animation: grow .55s var(--ease) both; }
#scr.enter[data-t="tab"] nav [aria-current="page"] > span { animation: pop-in .4s var(--spring) both; }

/* screen out */
#ghost[data-t="fwd"] > * > :not(header):not(nav):not(footer) { animation: out-left .2s ease-in both; }
#ghost[data-t="back"] > * > :not(header):not(nav):not(footer) { animation: out-right .2s ease-in both; }
#ghost:is([data-t="fwd"], [data-t="back"]) > * > footer { animation: out-fade .12s ease-in both; }
#ghost[data-t="slide"] > * { animation: slide-away .42s var(--ease) both; }
#ghost[data-t="tab"] > * > .scroll { animation: out-fade .16s ease-in both; }
#ghost > * > :is(header, nav) { animation: out-fade .2s ease-in both; }
#ghost.samehead > * > header, #ghost.samenav > * > nav { visibility: hidden; }
#ghost[data-t="home"] > * { animation: app-close .4s cubic-bezier(.4, 0, .2, 1) both; transform-origin: var(--ox) var(--oy); overflow: hidden; }
#ghost[data-t="zoom"] > * { animation: home-away .44s var(--ease) both; transform-origin: var(--ox) var(--oy); }
#ghost[data-t="up"] > * { animation: recede .46s var(--ease) both; }
#ghost[data-t="down"] > * { animation: sheet-down .34s cubic-bezier(.4, 0, 1, 1) both; }

/* content entrances (screen changes only) */
#scr.enter .rise { animation: rise .5s var(--ease) both; animation-delay: calc(var(--base) + var(--d, 0) * 1ms); }
#scr.enter .pop-in { animation: pop-in .55s var(--spring) both; animation-delay: calc(var(--base) + var(--d, 0) * 1ms); }
#scr.enter .stamp { animation: stamp .5s var(--spring) both; animation-delay: calc(var(--base) + var(--d, 0) * 1ms); }
#scr.enter :is(h1, h2) .hl { animation: hl-in .55s var(--spring) both; animation-delay: calc(var(--base) + 280ms); }
#scr.enter .jitter { animation: jitter .45s ease-in-out 2 both; animation-delay: calc(var(--base) + var(--d, 0) * 1ms); }
#scr.enter .jitter:nth-of-type(2) { --d: 120; }
#scr.enter .jitter:nth-of-type(3) { --d: 240; }
#scr.enter .grow-up { animation: grow-up .6s var(--spring) both; transform-origin: 50% 100%; animation-delay: calc(var(--base) + var(--d, 450) * 1ms); }
#scr.enter .grow-up:nth-of-type(2) { --d: 580; }
#scr.enter .nudge { animation: rise .5s var(--ease) both, wiggle .6s ease-in-out both; animation-delay: var(--base), calc(var(--base) + 700ms); }
#scr.enter .drop-in { animation: drop-in .55s var(--spring) both; animation-delay: calc(var(--base) + 160ms); }
#scr.enter .wiggle-in { animation: wiggle .6s ease-in-out both; animation-delay: calc(var(--base) + 520ms); }
#scr.enter .tl-line { animation: draw-y .8s var(--ease) both; transform-origin: 50% 0; animation-delay: calc(var(--base) + 100ms); }
#scr.enter .rays { animation: rays-in .7s var(--ease) both, spin 26s linear infinite; }
#scr.enter .confetti i { animation: burst var(--t) both; animation-delay: calc(var(--base) + var(--dl)); }
.reveal:not(.in) * { animation-play-state: paused !important; }

/* idle loops (never on anything you tap) and tap feedback */
.float { animation: float 4.2s ease-in-out infinite; }
.rays { position: absolute; inset: -34px; border-radius: 50%; pointer-events: none;
  background: repeating-conic-gradient(from 0deg, rgba(255,210,110,.62) 0deg 9deg, transparent 9deg 24deg);
  -webkit-mask-image: radial-gradient(circle, #000 28%, transparent 70%); mask-image: radial-gradient(circle, #000 28%, transparent 70%); animation: spin 26s linear infinite; }
.confetti { position: absolute; left: 50%; top: 168px; width: 0; height: 0; z-index: 6; pointer-events: none; }
.confetti i { position: absolute; left: calc(var(--w) / -2); top: calc(var(--h) / -2); width: var(--w); height: var(--h); background: var(--c); border-radius: var(--br); opacity: 0; }
.tapped { animation: bump .34s var(--spring); }
.tapped :is(.chk, .check) { animation: pop-in .4s var(--spring) both; }
.sw.tapped { animation: none; }
.sw.on { --k: -20px; }
.sw:not(.on) { --k: 20px; }
.sw.tapped span { animation: knob .28s var(--spring); }
.wiggle { animation: wiggle .6s ease-in-out; }
#scr .popnow { animation: pop-in .5s var(--spring) both; }
#scr .unlock { animation: unlock .5s var(--spring) both; }
.stamp-in { animation: stamp .55s var(--spring) both; animation-delay: calc(var(--d, 0) * 1ms); }

  }

  const lines = [S.shieldMsg.trim() ? esc(S.shieldMsg.trim()) : chLine ? chLine : S.goal ? `You’re saving for ${esc(S.goal)}.` : SHIELD_LINE[tag]];

/* The current week, Monday first, with the number of decisions made each day */
function weekDays() {
  const now = new Date(), dow = (now.getDay() + 6) % 7;
  return Array.from({ length: 7 }, (_, i) => {
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dow + i), key = d.toDateString();
    return { i, n: S.history.filter((x) => x.app && new Date(x.at).toDateString() === key).length, today: i === dow, future: i > dow };
  });
}
const DAY_NAMES = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

/* the order total: a "total" line (not subtotal or delivery), else the line after it, else the biggest price on the page */
function findTotal(text) {
  const lines = String(text || '').split(/\n+/).map((l) => l.trim()).filter(Boolean);
  const amts = (l) => [...l.replace(/(\d),(\d{2})(?!\d)/g, '$1.$2').matchAll(/(?:£|GBP|\$|€)\s?(\d{1,3}(?:,\d{3})+(?:\.\d{2})?|\d{1,5}(?:\.\d{1,2})?)|(\d{1,5}\.\d{2})(?!\d)/gi)].map((m) => parseFloat((m[1] || m[2]).replace(/,/g, ''))).filter((n) => n > 0 && n < 100000);

async function readProof(src, isSample) {

/* Timers: pass countdowns, re-block when a pass ends, the pause ring */
